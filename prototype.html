<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拾课 · 时间轴重放（交互原型）</title>
<style>
  :root {
    --paper: #faf9f7;
    --ink: #1a1a1a;
    --ink-2: #5f5a54;
    --ink-3: #9a948d;
    --line: #e3dfd8;
    --card: #ffffff;
    --wrong: #b3261e;
    --wrong-bg: #fdf1ef;
    --miss: #a06a12;
    --miss-bg: #fdf6e8;
    --unclear: #6b6b6b;
    --unclear-bg: #f2f1ee;
    --ok: #1d6b4a;
    --ok-bg: #eaf4ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
    padding-bottom: 40px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px 16px 0; }

  /* ---------- 顶栏 ---------- */
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .course { font-size: 13px; color: var(--ink-2); }
  .badge-mock { margin-left: auto; font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 20px; padding: 2px 9px; }

  /* ---------- 时间轴 ---------- */
  .transport { padding: 14px 0 4px; }
  .tline-row { display: flex; align-items: center; gap: 12px; }
  .playbtn {
    flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--ink);
    background: var(--ink); color: #fff; font-size: 13px; cursor: pointer; line-height: 1;
  }
  .playbtn.playing { background: var(--wrong); border-color: var(--wrong); }
  .clock { font: 600 17px/1 ui-monospace, Consolas, monospace; letter-spacing: -.02em; min-width: 108px; }
  .clock .tot { color: var(--ink-3); font-weight: 400; font-size: 13px; }

  .track {
    position: relative; height: 42px; margin: 10px 0 2px; cursor: pointer;
    border-radius: 8px; background: linear-gradient(to bottom, transparent 18px, var(--line) 18px, var(--line) 20px, transparent 20px);
    touch-action: none;
  }
  .track .fill { position: absolute; left: 0; top: 18px; height: 2px; background: var(--ink); }
  .track .head {
    position: absolute; top: 10px; width: 3px; height: 18px; background: var(--ink);
    transform: translateX(-1px); border-radius: 2px;
  }
  .mk { position: absolute; transform: translateX(-50%); }
  .mk.photo { top: 2px; width: 13px; height: 13px; border: 1.5px solid var(--ink-2); border-radius: 2px; background: var(--card); }
  .mk.note  { top: 33px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .mk.susp  { top: -6px; width: 0; height: 0; box-sizing: content-box;
             border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 8px solid var(--wrong); }
  .mk.susp.miss { border-top-color: var(--miss); }
  .mk.susp.unclear { border-top-color: var(--unclear); }
  .ticks { position: relative; height: 15px; font: 10.5px/1 ui-monospace, Consolas, monospace; color: var(--ink-3); }
  .ticks span { position: absolute; transform: translateX(-50%); }

  .legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--ink-2); padding: 2px 0 12px 54px; flex-wrap: wrap; }
  .legend i { display: inline-block; vertical-align: -1px; margin-right: 4px; }
  .legend .sq { width: 9px; height: 9px; border: 1.4px solid var(--ink-2); border-radius: 1px; }
  .legend .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .legend .tr { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 7px solid var(--wrong); }

  /* ---------- 主区 ---------- */
  .main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 860px) { .main { grid-template-columns: 1fr; } }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .panel-hd { font-size: 11.5px; color: var(--ink-3); padding: 9px 14px 0; letter-spacing: .04em; }

  /* 板书 */
  .board {
    margin: 8px 14px 0; border-radius: 7px; background: #f7f5f0; border: 1px solid #e4dfd4;
    box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.03);
    padding: 18px 20px; min-height: 160px; position: relative;
  }
  .board .chalk { font: 400 15px/1.9 ui-serif, Georgia, "Songti SC", serif; color: #2a2f2b; white-space: pre-wrap; }
  .board .chalk b { font-weight: 600; }
  .board-cap { margin: 7px 14px 14px; font: 11px/1.5 -apple-system, "PingFang SC", sans-serif; color: var(--ink-3); }
  .board-cap::before { content: "▣ "; font-size: 10px; }

  /* 转写 */
  .tx { margin: 6px 14px 14px; font-size: 14.5px; line-height: 1.85; color: var(--ink-2); }
  .tx s { text-decoration: none; }
  .tx .cur { background: #fff8d8; color: var(--ink); box-shadow: 0 0 0 3px #fff8d8; border-radius: 2px; }
  .tx .lowconf { border-bottom: 1.5px dotted var(--unclear); }

  /* 我的笔记 */
  .note-box { margin: 0 14px 14px; border-left: 2px solid var(--line); padding: 2px 0 2px 12px; }
  .note-box .lb { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; margin-bottom: 3px; }
  .note-box .ln { font: 13.5px/1.8 ui-monospace, Consolas, monospace; color: #35302b; }
  .note-box .ln .err { background: var(--wrong-bg); color: var(--wrong); border-bottom: 1.5px solid var(--wrong); }

  /* ---------- 疑点 ---------- */
  h2.sec { font-size: 13px; letter-spacing: .04em; color: var(--ink-3); font-weight: 600; margin: 22px 0 9px; }
  .susp-list { display: grid; gap: 9px; }
  .susp {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px;
    border-left: 3px solid var(--ink-3);
  }
  .susp.wrong { border-left-color: var(--wrong); }
  .susp.miss { border-left-color: var(--miss); }
  .susp.unclear { border-left-color: var(--unclear); }
  .susp.resolved { opacity: .62; }
  .susp-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 20px; letter-spacing: .02em; }
  .tag.wrong { background: var(--wrong-bg); color: var(--wrong); }
  .tag.miss { background: var(--miss-bg); color: var(--miss); }
  .tag.unclear { background: var(--unclear-bg); color: var(--unclear); }
  .susp-time { font: 11.5px/1 ui-monospace, Consolas, monospace; color: var(--ink-3); }
  .susp-jump { margin-left: auto; font-size: 11.5px; color: var(--ink-2); background: none; border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; cursor: pointer; }
  .diff { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 10px; }
  @media (max-width: 520px) { .diff { grid-template-columns: 1fr; } }
  .diff > div { background: #fbfaf8; border: 1px solid #eeebe4; border-radius: 9px; padding: 8px 10px; }
  .diff .k { font-size: 10.5px; color: var(--ink-3); margin-bottom: 2px; }
  .diff .v { font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .diff .v.bad { color: var(--wrong); }
  .actions { display: flex; gap: 7px; flex-wrap: wrap; }
  .actions button {
    font: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .actions button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .actions button:disabled { opacity: .45; cursor: default; }
  .resolved-stamp { font-size: 12px; color: var(--ok); background: var(--ok-bg); border-radius: 8px; padding: 6px 10px; display: inline-block; }

  .foot { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-3); line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">拾课</div>
    <div class="course">信号与系统 · 第 7 讲 · 拉普拉斯变换</div>
    <div class="badge-mock">交互原型 · 数据为虚构示例</div>
  </div>

  <div class="transport">
    <div class="tline-row">
      <button class="playbtn" id="play" title="播放/暂停（原型无音轨，仅模拟推进）">▶</button>
      <div class="clock"><span id="cur">06:40</span> <span class="tot">/ 47:12</span></div>
      <div style="flex:1"></div>
      <div class="clock" style="text-align:right; font-size:12px; color:var(--ink-3); font-weight:400;">
        疑点 <b id="pending" style="color:var(--wrong); font-weight:700;">3</b> 待确认
      </div>
    </div>

    <div class="track" id="track">
      <div class="fill" id="fill"></div>
      <div class="head" id="head"></div>
    </div>
    <div class="ticks" id="ticks"></div>
    <div class="legend">
      <span><i class="sq"></i>拍照/板书</span>
      <span><i class="dot"></i>落笔</span>
      <span><i class="tr"></i>疑点</span>
    </div>
  </div>

  <div class="main">
    <section class="panel">
      <div class="panel-hd">此刻的黑板 / PPT</div>
      <div class="board"><div class="chalk" id="boardText"></div></div>
      <div class="board-cap" id="boardStamp"></div>
      <div class="panel-hd">你当时记的</div>
      <div class="note-box">
        <div class="ln" id="noteText"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-hd">课堂原声转写</div>
      <div class="tx" id="tx"></div>
    </section>
  </div>

  <h2 class="sec">疑点清单（AI 只提议，你裁决）</h2>
  <div class="susp-list" id="susps"></div>

  <div class="foot">
    原型说明：时间轴可拖动/点击；疑点的三个按钮可点，点了会改变状态。<br>
    真实版本里「听这 3 秒」会播放对应音频，「改成正确答案」会把修正写回你的笔记并记住这类错误。
  </div>
</div>

<script>
(() => {
  const TOTAL = 47 * 60 + 12;   // 47:12

  // ---- 虚构分段：真实版本由 ASR 时间戳 + 板书 VLM 结果生成 ----
  const segs = [
    {
      t0: 0, t1: 420,
      board: '考前回顾

卷积定理 · 拉普拉斯变换 · 系统稳定性',
      stamp: '02:14 拍摄 · 板书',
      note: '期末会考卷积定理
拉氏变换 → 时域到 s 域',
      tx: '上节课我们讲了卷积定理，今天把拉普拉斯变换补上，这一块期末一定会考。',
    },
    {
      t0: 420, t1: 900,
      board: 'h(t) = e^(−2t)·u(t)

H(s) = 1/(s+2)
ROC: Re{s} > −2',
      stamp: '12:36 拍摄 · PPT',
      note: 'h(t) = e^−2t u(t)
H(s) = 1/(s+2)',
      tx: '所以这个系统的冲激响应是 e 的负二 t 次方乘 u(t)，对应拉氏变换就是 s 加二分之一。注意收敛域是 s 的实部大于负二，不是大于二。',
    },
    {
      t0: 900, t1: 1500,
      board: '因果系统：ROC 一定在最右极点的右侧

极点 −2 → ROC: Re{s} > −2',
      stamp: '21:05 拍摄 · 板书',
      note: 'Re{s} > 2',
      tx: '这里要强调，因果系统的收敛域一定在最右边极点的右侧。这个结论要记住。',
    },
    {
      t0: 1500, t1: 2100,
      board: '例：求 e^(−3t)u(t) 的拉氏变换

∫₀^∞ e^(−3t)·e^(−st)dt = 1/(s+3)',
      stamp: '31:40 拍摄 · 板书',
      note: '∫0∞ e^−3t e^−st dt = 1/(s+3)
ROC: Re{s} > −3',
      tx: '举个例子，e 的负三 t 次方乘 u(t)，积分出来是 s 加三分之一，收敛域需要注意。',
    },
    {
      t0: 2100, t1: 2832,
      board: '稳定性与极点的关系

全部极点位于左半平面 ⇔ 稳定',
      stamp: '38:48 拍摄 · PPT',
      note: '极点在左半平面 → 稳定
（这里没记太清）',
      tx: '如果一个系统的所有极点都在左半平面，那么它就是_稳定_的，这个_稳定_性判据要会推。',
    },
  ];

  const susps = [
    {
      id: 's1', type: 'wrong', at: 12 * 60 + 36, segIdx: 1,
      title: '你把收敛域记成了大于 2',
      mine: 'Re{s} > 2', truth: 'Re{s} > −2',
      body: '录音里老师说「大于负二」，板书写的是 Re{s} > −2。你笔记里的负号丢了。',
      fixLabel: '改成 Re{s} > −2',
    },
    {
      id: 's2', type: 'miss', at: 21 * 60 + 5, segIdx: 2,
      title: '老师强调的结论你没记',
      mine: '（这段笔记是空的）', truth: '因果系统：ROC 一定在最右极点的右侧',
      body: '老师在 21:05 板书这行，并连说了两遍「要记住」。你的笔记在 15–25 分钟之间没有落笔。',
      fixLabel: '补进笔记',
    },
    {
      id: 's3', type: 'unclear', at: 38 * 60 + 48, segIdx: 4,
      title: '这句可能没听清',
      mine: '极点在左半平面 → 稳定', truth: '转写置信度低：「_稳定_」这一段',
      body: '该段音频信噪比低，转写把「稳定性判据」识别成两处断词。建议听原声确认。',
      fixLabel: '听 4 秒原声',
    },
  ];

  const el = {
    track: document.getElementById('track'),
    fill: document.getElementById('fill'),
    head: document.getElementById('head'),
    ticks: document.getElementById('ticks'),
    cur: document.getElementById('cur'),
    play: document.getElementById('play'),
    boardText: document.getElementById('boardText'),
    boardStamp: document.getElementById('boardStamp'),
    noteText: document.getElementById('noteText'),
    tx: document.getElementById('tx'),
    susps: document.getElementById('susps'),
    pending: document.getElementById('pending'),
  };

  const pad = n => String(n).padStart(2, '0');
  const mmss = s => `${pad(Math.floor(s / 60))}:${pad(Math.floor(s % 60))}`;

  let t = 1100;           // 当前时间（秒）
  let playing = false;
  let raf = null;
  let lastFrame = 0;

  // 刻度
  for (let m = 0; m <= 45; m += 5) {
    const s = document.createElement('span');
    s.textContent = m + '′';
    s.style.left = (m * 60 / TOTAL * 100) + '%';
    el.ticks.appendChild(s);
  }
  // 标记
  segs.forEach((sg, i) => {
    const p = document.createElement('div');
    p.className = 'mk photo';
    p.style.left = ((sg.t0 + 20) / TOTAL * 100) + '%';
    el.track.appendChild(p);
    const n = document.createElement('div');
    n.className = 'mk note';
    n.style.left = ((sg.t0 + 90) / TOTAL * 100) + '%';
    el.track.appendChild(n);
  });
  susps.forEach(sp => {
    const d = document.createElement('div');
    d.className = 'mk susp ' + (sp.type === 'miss' ? 'miss' : sp.type === 'unclear' ? 'unclear' : '');
    d.style.left = (sp.at / TOTAL * 100) + '%';
    el.track.appendChild(d);
  });

  function segAt(sec) {
    return segs.find(s => sec >= s.t0 && sec < s.t1) || segs[segs.length - 1];
  }

  function renderTime() {
    el.cur.textContent = mmss(t);
    const pct = t / TOTAL * 100;
    el.fill.style.width = pct + '%';
    el.head.style.left = pct + '%';

    const sg = segAt(t);
    el.boardText.textContent = sg.board;
    el.boardStamp.textContent = sg.stamp;
    el.noteText.innerHTML = (sg.note || '（空）').split('\n').map(l =>
      sg.note === 'Re{s} > 2' ? '<span class="err">' + l + '</span>' : l
    ).join('<br>');

    // 当前句高亮：把这一段的转写按「，。」切句，按段内进度推进
    const frac = Math.min(1, Math.max(0, (t - sg.t0) / (sg.t1 - sg.t0)));
    const parts = sg.tx.split(/(?<=[，。；])/).filter(Boolean);
    const idx = Math.min(parts.length - 1, Math.floor(frac * parts.length));
    el.tx.innerHTML = parts.map((p, i) => {
      let html = p.replace(/_(.+?)_/g, '<span class="lowconf">$1</span>');
      return i === idx ? `<span class="cur">${html}</span>` : html;
    }).join('');
  }

  function seek(sec) {
    t = Math.min(TOTAL - 1, Math.max(0, sec));
    renderTime();
  }

  // 拖动 / 点击时间轴
  let dragging = false;
  function posToSec(clientX) {
    const r = el.track.getBoundingClientRect();
    return (clientX - r.left) / r.width * TOTAL;
  }
  el.track.addEventListener('pointerdown', e => {
    dragging = true;
    el.track.setPointerCapture(e.pointerId);
    stop();
    seek(posToSec(e.clientX));
  });
  el.track.addEventListener('pointermove', e => { if (dragging) seek(posToSec(e.clientX)); });
  el.track.addEventListener('pointerup', e => { dragging = false; });
  el.track.addEventListener('pointercancel', () => { dragging = false; });

  // 播放（原型无音轨，仅推进时间以展示重放手感）
  function tickFn(ts) {
    if (!playing) return;
    if (!lastFrame) lastFrame = ts;
    const dt = (ts - lastFrame) / 1000;
    lastFrame = ts;
    t += dt * 12;              // 12 倍速走查
    if (t >= TOTAL) { t = TOTAL - 1; stop(); }
    renderTime();
    raf = requestAnimationFrame(tickFn);
  }
  function play() {
    if (playing) return;
    playing = true;
    lastFrame = 0;
    el.play.textContent = '❚❚';
    el.play.classList.add('playing');
    raf = requestAnimationFrame(tickFn);
  }
  function stop() {
    playing = false;
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    el.play.textContent = '▶';
    el.play.classList.remove('playing');
  }
  el.play.addEventListener('click', () => playing ? stop() : play());

  // 疑点卡片
  const state = { s1: 'pending', s2: 'pending', s3: 'pending' };
  const TAG = { wrong: '错记', miss: '漏记', unclear: '没听清' };

  function renderSusps() {
    el.susps.innerHTML = '';
    let pending = 0;
    for (const sp of susps) {
      const st = state[sp.id];
      if (st === 'pending') pending++;

      const card = document.createElement('div');
      card.className = `susp ${sp.type}` + (st !== 'pending' ? ' resolved' : '');
      card.innerHTML = `
        <div class="susp-top">
          <span class="tag ${sp.type}">${TAG[sp.type]}</span>
          <span class="susp-time">${mmss(sp.at)}</span>
          <button class="susp-jump" data-jump="${sp.segIdx}">跳到这一刻 →</button>
        </div>
        <div style="font-weight:600; font-size:14.5px; margin-bottom:8px;">${sp.title}</div>
        <div class="diff">
          <div><div class="k">你记的</div><div class="v ${sp.type === 'wrong' ? 'bad' : ''}">${sp.mine}</div></div>
          <div><div class="k">录音 / 板书里</div><div class="v">${sp.truth}</div></div>
        </div>
        <div style="font-size:13px; color:var(--ink-2); margin-bottom:10px;">${sp.body}</div>
        <div class="actions"></div>
      `;
      const act = card.querySelector('.actions');

      if (st === 'pending') {
        const b1 = document.createElement('button');
        b1.className = 'primary';
        b1.textContent = sp.fixLabel;
        b1.onclick = () => { state[sp.id] = 'accepted'; renderSusps(); };
        act.appendChild(b1);

        if (sp.type !== 'unclear') {
          const b2 = document.createElement('button');
          b2.textContent = '我记的是对的';
          b2.onclick = () => { state[sp.id] = 'rejected'; renderSusps(); };
          act.appendChild(b2);
        }
        const b3 = document.createElement('button');
        b3.textContent = '误报';
        b3.onclick = () => { state[sp.id] = 'false_positive'; renderSusps(); };
        act.appendChild(b3);
      } else {
        const msg = {
          accepted: sp.type === 'miss' ? '已补进笔记' : sp.type === 'unclear' ? '已听原声，转写已校正' : '已改成 ' + sp.truth,
          rejected: '已保留你的笔记（AI 判断有误）',
          false_positive: '已标记为误报，这类规则会降权',
        }[st];
        const badge = document.createElement('span');
        badge.className = 'resolved-stamp';
        badge.textContent = '✓ ' + msg;
        act.appendChild(badge);
        const undo = document.createElement('button');
        undo.textContent = '撤销';
        undo.onclick = () => { state[sp.id] = 'pending'; renderSusps(); };
        act.appendChild(undo);
      }

      card.querySelectorAll('[data-jump]').forEach(btn => {
        btn.onclick = () => { stop(); seek(segs[Number(btn.dataset.jump)].t0 + 10); window.scrollTo({ top: 0 }); };
      });
      el.susps.appendChild(card);
    }
    el.pending.textContent = pending;
  }

  renderTime();
  renderSusps();
})();
</script>
